limit: 5000
memory_size: 0x1000
memory_mapped_io:
  0x80: [65, 65, 65, 66, 66, 66, 66, 67, 67, 67, 67, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}: stack={stack} locals={locals}
  - name: Check results
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
