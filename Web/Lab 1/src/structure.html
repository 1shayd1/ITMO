<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="script.js"></script>
    <title>Web Lab 1</title>
</head>

<body>
    <fieldset>
        <header>
            Шалабодов Ярослав Дмитриевич, Р3110, Вариант 12668
        </header>
    </fieldset>

    <div class="input-block">
        <form>
            <fieldset>
                <br/>
                <div>
                    <label for="x-select">Поле Х</label>
                    <select id="x-select">
                        <option value="choose">Выберите значение</option>
                        <option value="-3">-3</option>
                        <option value="-2">-2</option>
                        <option value="-1">-1</option>
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <br/>

                <div>
                    <label for="y-text">Поле Y</label>
                    <input type="text" id="y-text" placeholder="введите значение (-3...3)"/>
                </div>
                <br/>

                <div>
                    <button type="submit">Проверить</button>
                </div>
                <br/>

                <fieldset>
                    <legend>Поле R</legend>
                    <div>
                        <input type="radio" id="r-1" name="radio" value="1"/>
                        <label for="r-1">1</label>
                    </div>
                    <div>
                        <input type="radio" id="r-1-5" name="radio" value="1.5"/>
                        <label for="r-1-5">1.5</label>
                    </div>
                    <div>
                        <input type="radio" id="r-2" name="radio" value="2"/>
                        <label for="r-2">2</label>
                    </div>
                    <div>
                        <input type="radio" id="r-2-5" name="radio" value="2.5"/>
                        <label for="r-2-5">2.5</label>
                    </div>
                    <div>
                        <input type="radio" id="r-3" name="radio" value="3"/>
                        <label for="r-3">3</label>
                    </div>
                </fieldset>
                <br/>
            </fieldset>
        </form>
    </div>

    <div class="canvas-block">
        <fieldset>
            <canvas height="460" width="460" id="canvas"></canvas>
        </fieldset>
    </div>

    <div class="table-block">
        <fieldset>
            <table>
                <caption>Статистика попадания точки </caption>
                <thead>
                <tr>
                    <th scope="col">X</th>
                    <th scope="col">Y</th>
                    <th scope="col">R</th>
                    <th scope="col">Попадание</th>
                    <th scope="col">Время</th>
                </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </fieldset>
    </div>
</body>
</html>
